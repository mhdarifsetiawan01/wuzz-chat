        avatar_url:
          type: string
        type:
          type: string
          enum: [public, private]
          default: private

    Group:
      type: object
      properties:
        id:
          type: string
        tenant_id:
          type: string
        name:
          type: string
        description:
          type: string
        avatar_url:
          type: string
        type:
          type: string
        created_by:
          type: string
        members_count:
          type: integer
        subgroups_count:
          type: integer
        created_at:
          type: string
          format: date-time

    GroupMember:
      type: object
      properties:
        user_id:
          type: string
        group_id:
          type: string
        role:
          type: string
          enum: [admin, member]
        joined_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/User'

    CreateSubgroupRequest:
      type: object
      description: |
        Payload `POST /api/groups/{id}/subgroups` (sesuai `handleCreateSubGroup`). Hanya admin atau pembuat grup induk.
        Durasi memakai SATU daftar di server (`store.SubGroupDurationDays`); selain nilai di bawah ditolak 400.
        Dengan `FORUM_LIMITS_ENABLED`, paket Gratis hanya boleh 7 hari (30 hari ditolak 403 `duration_not_in_plan`).
      required:
        - title
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 128
          example: Incident-2026-09
        description:
          type: string
          maxLength: 500
          example: Post-mortem war room
        duration:
          type: string
          description: Masa aktif forum. Kosong = 7_days. Alias yang diterima server tercantum di enum.
          enum: [7_days, 7d, 1_week, week, 30_days, 30d, 1_month, month]
          default: 7_days
          example: 7_days
        is_public:
          type: boolean
          description: true = anggota grup induk langsung bergabung; false = perlu izin admin. Default true.
          default: true

    Subgroup:
      type: object
      properties:
        id:
          type: string
        parent_group_id:
          type: string
        name:
          type: string
        description:
          type: string
        expires_at:
          type: string
          format: date-time
        is_expired:
          type: boolean
        created_by:
          type: string
        created_at:
          type: string
          format: date-time

    JoinRequest:
