  /api/messages:
    get:
      tags:
        - Messages
      summary: Get Message History for Room
      description: Fetches paginated messages. With message_id, returns a bounded forum source context (20 before, target, 20 after; fewer after privacy filtering). Requires forum and parent membership in the authenticated tenant. Ended forums remain readable. Memory access does not grant source access.
      security:
        - BearerAuth: []
      parameters:
        - name: room_id
          in: query
          required: true
          description: Conversation ID (alias conversation_id)
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            maximum: 100
        - name: before
          in: query
          required: false
          description: RFC3339 timestamp cursor for backward pagination (ignored when message_id is provided). Invalid format = 400.
          schema:
            type: string
        - name: message_id
          in: query
          required: false
          description: Source message in room_id (sub_ forum only). Takes precedence over before and limit. Ordering is timestamp then ID. Does not change latest-history pagination.
          schema:
            type: string
      responses:
        '404':
          description: Source missing, deleted for everyone/viewer, before the viewer history cutoff, wrong room, or inaccessible. Same response prevents existence disclosure.
        '200':
          description: Message list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
        '400':
          description: room_id missing or invalid before cursor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller is not a member of the room
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
