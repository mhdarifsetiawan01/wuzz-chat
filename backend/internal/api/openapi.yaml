          description: Request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserConnection'
        '400':
          description: 'target_user_id missing or self request'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Too many pending outgoing requests'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 'Already friends or already requested'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 'Cooldown after a decline, rate limit or daily limit'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/connections/respond:
    post:
      tags:
        - Connections
      security:
        - BearerAuth: []
      summary: Accept or Decline a Friend Request
      description: Only the receiver of the request may respond.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [connection_id, action]
              properties:
                connection_id:
                  type: string
                action:
                  type: string
                  enum: [accept, decline]
      responses:
        '200':
          description: Updated connection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserConnection'
        '400':
          description: 'Missing fields or invalid action'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Caller is not the receiver'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'Connection not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/connections/friends:
    get:
      tags:
        - Connections
      security:
        - BearerAuth: []
      summary: List Friends (cursor pagination)
      parameters:
        - name: cursor
          in: query
          required: false
