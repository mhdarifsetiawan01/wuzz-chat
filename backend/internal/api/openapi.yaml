        '403':
          description: Not a member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/media/upload:
    post:
      tags:
        - Media Attachments
      summary: Upload a File through the Server (relay)
      description: |
        Multipart upload relayed through the API server (local disk / S3 drivers). Drivers that require direct upload
        (Cloudflare R2 in production) answer 410: use POST /api/media/signed-upload-url instead. Executables are
        rejected. 40 uploads/minute per user (shared with signed-upload-url).
      security:
        - BearerAuth: []
      parameters:
        - name: purpose
          in: query
          required: false
          description: 'feed = image only (JPG, PNG, WebP, GIF, HEIC; magic bytes checked); video = MP4/MOV/M4V/WebM, uses the video size limit and returns a thumbnail ticket. Recorded on the upload ticket.'
          schema:
            type: string
            enum: [feed, video]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaUploadResponse'
        '400':
          description: Missing file, file too large, forbidden type, or not an allowed feed image
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Media upload disabled by the administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: Relay upload disabled for this storage driver; use signed-upload-url
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Upload rate limit
        '500':
          description: Storage not configured or write failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/media/signed-upload-url:
    post:
      tags:
        - Media Attachments
      summary: Get a Direct Upload Ticket (signed URL)
      description: |
        Returns a pre-signed PUT URL for direct upload to object storage (R2). Upload the bytes to `signed_url`, then
        send `public_url` in the message. For `purpose=video` and drivers that support it, `thumb_size` is required
        and a thumbnail ticket is returned (thumbnail URL = video URL with `.thumb.jpg`). Each ticket is recorded for
        the orphan-upload sweeper. 40 requests/minute per user.
      security:
        - BearerAuth: []
      parameters:
        - name: purpose
          in: query
          required: false
          description: 'feed = image only (JPG, PNG, WebP, GIF, HEIC; magic bytes checked); video = MP4/MOV/M4V/WebM, uses the video size limit and returns a thumbnail ticket. Recorded on the upload ticket.'
          schema:
            type: string
            enum: [feed, video]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file_name]
              properties:
                file_name:
                  type: string
                file_size:
                  type: integer
                  format: int64
                  description: Bytes. Required for purpose=video.
                mime_type:
                  type: string
                thumb_size:
                  type: integer
                  format: int64
                  description: JPEG thumbnail size in bytes (purpose=video).
      responses:
        '200':
          description: Upload ticket
          content:
            application/json:
              schema:
                type: object
                properties:
                  signed_url:
                    type: string
                  public_url:
                    type: string
                  object_key:
                    type: string
                  token:
                    type: string
                  thumb_signed_url:
                    type: string
                  thumb_public_url:
                    type: string
        '400':
          description: Invalid body, size over the limit, forbidden/unsupported type, or invalid thumb_size
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Media upload disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Storage not configured or signing failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: 'NOT_SUPPORTED - storage driver has no direct upload; use /api/media/upload'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/media/ack:
    post:
      tags:
        - Media Attachments
      summary: Acknowledge Media Download
      description: |
        Tells the server the recipient downloaded a message's media. When auto-delete-on-download is enabled and every
        recipient has acknowledged, the stored file is deleted and `media_status` becomes `downloaded`. Caller must be
        a member of the message's conversation.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message_id]
              properties:
                message_id:
                  type: string
                room_id:
                  type: string
      responses:
        '200':
          description: Acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: acknowledged
                  media_status:
                    type: string
        '400':
          description: message_id missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not a member of the conversation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Media message not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/connections/request:
