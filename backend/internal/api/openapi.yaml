            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PendingRequestItem'

  /api/connections/status/{userId}:
    get:
      tags:
        - Connections
      security:
        - BearerAuth: []
      summary: Relationship Status with a User
      description: Also tells whether the caller may message or call the user (private accounts, blocks).
      parameters:
        - name: userId
          in: path
