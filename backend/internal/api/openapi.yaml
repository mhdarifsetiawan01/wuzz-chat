openapi: 3.1.0
info:
  title: WuzzChat Engine API
  version: 1.0.0
  description: |
    Enterprise Multi-Tenant Messaging Engine, Headless Realtime Chat, AI Memory, and E2EE Signaling Server.
    
    WuzzChat is a production-grade, headless communication engine designed for modern web, mobile (Flutter/React Native/Native iOS & Android), and B2B third-party platform integrations.
    
    Key Features:
    - **Multi-Tenancy**: Data isolation with automatic tenant resolution via `X-Tenant-ID` header or JWT claims.
    - **B2B Token Provisioning**: Server-to-server JIT provisioning via `X-App-ID` & `X-App-Secret` and 60-second client token exchange.
    - **Zero-Knowledge E2EE**: ECDH (P-256) + HKDF-SHA256 + AES-256-GCM architecture. Server never sees plaintext content.
    - **Level 2 Multi-Device Support**: Up to 2 concurrent devices per user with FIFO session eviction (`SESSION_REPLACED`).
    - **Store-and-Forward Media**: Ephemeral media auto-deletion upon client download acknowledgement (ACK) for 1-on-1 chats; 7-day retention for group fora.
    - **AI Memory Engine**: Human-in-the-Loop review lifecycle for AI-synthesized group memories and ephemeral fora.
  contact:
    name: WuzzChat Core Team
    url: https://chat.wuzzhub.id
    email: support@semanticdigital.id
  license:
    name: Proprietary / MIT

servers:
  - url: https://chat-api.wuzzhub.id
    description: Live Production Server (VPS)
  - url: http://localhost:8080
    description: Local Development Server

tags:
  - name: B2B Gateway
    description: Server-to-Server JIT User Provisioning & 60s Client Token Exchange
  - name: Authentication & Identity
    description: Registration, Login, Session Revocation, Multi-Device Quota, Password & Key Lifecycle
  - name: Conversations & Chat
    description: 1-on-1 Direct Chat Inception, Conversation Clearing, Pinning, and Room Metadata
  - name: Messages
    description: History Query, Realtime Messaging, Edits, Deletion (Self/Everyone), Pinning, Forwarding, and Receipts
  - name: Media Attachments
    description: Store-and-Forward Encrypted File Uploads and Download Acknowledgements (ACK)
  - name: Groups & Communities
    description: Group Creation, Settings, Member Roster, and Role Management
  - name: Ephemeral Fora (Subgroups)
    description: TTL-based Ephemeral Sub-channels, Instant Expiration, Join Requests, and Approvals
  - name: AI Memory Engine
    description: Group Context AI Memory Drafts, Human-in-the-Loop Artifact Editing, Approval, and Member Knowledge
  - name: Push Notifications
    description: Web Push VAPID Public Key Distribution and Push Subscription Management
  - name: Utility & Diagnostics
    description: Health Probes, Client System Configuration, and OpenGraph Link Previews
  - name: Wuzz Grid (Daily Game)
    description: Daily logic-grid puzzle with streaks, friends/group/public leaderboards, reminders and staff moderation of the public board
  - name: Connections
    description: Friends, friend requests and blocking

paths:
  # =========================================================================
  # 1. B2B GATEWAY
  # =========================================================================
  /api/v1/auth/provision-token:
    post:
      tags:
        - B2B Gateway
      summary: Provision JIT User & Issue 60s Exchange Token
      description: |
        Called server-to-server by third-party B2B backend systems to silently provision or upsert a user within their tenant and obtain a single-use 60-second exchange token.
        
        Requires `X-App-ID` and `X-App-Secret` headers matching an active tenant.
      security:
        - B2BAppID: []
          B2BAppSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisionTokenRequest'
      responses:
        '200':
          description: Exchange token generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvisionTokenResponse'
        '400':
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid B2B application credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Tenant is inactive, suspended, or rate-limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/exchange:
    post:
      tags:
        - B2B Gateway
      summary: Exchange One-Time Token for Session JWT
      description: |
        Called by the third-party client application (Web/Mobile SDK) using the short-lived exchange token to receive a 30-day WuzzChat session JWT.
      parameters:
        - $ref: '#/components/parameters/HeaderTenantID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExchangeTokenRequest'
      responses:
        '200':
          description: Token exchanged successfully. Returns standard session JWT and user profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          description: Invalid request or missing exchange token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Exchange token expired, consumed, or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # =========================================================================
  # 2. AUTHENTICATION & IDENTITY
  # =========================================================================
  /api/auth/register:
    post:
      tags:
        - Authentication & Identity
      summary: Register a New User Account
      description: |
        Registers a new user account within the resolved tenant. Rate-limited to 15 requests/minute per IP.
      parameters:
        - $ref: '#/components/parameters/HeaderTenantID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          description: Validation error or invalid inputs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Username already exists in this tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded (shared per-IP auth limiter)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/login:
    post:
      tags:
        - Authentication & Identity
      summary: Authenticate User & Issue Session JWT
      description: |
        Validates username and password within the tenant. Enforces a maximum of 2 active devices per user
        (409 DEVICE_LIMIT_REACHED; retry with `confirm_override` + `kick_device_id`). Suspended accounts get 403.
      parameters:
        - $ref: '#/components/parameters/HeaderTenantID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: ACCOUNT_SUSPENDED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: DEVICE_LIMIT_REACHED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceLimitConflict'
        '429':
          description: Too many failed login attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/me:
    get:
      tags:
        - Authentication & Identity
      summary: Get Current User Profile
      description: Returns the caller's profile with login-method flags (Google link, password, freeze, suspension).
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Unauthorized or expired token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Authentication & Identity
      summary: Delete Own Account Permanently
      description: |
        Erases the caller's account after re-authentication with `password`, or `google_id_token` (fresh Google ID
        token, max 5 minutes) for Google-linked accounts. Revokes all sessions and closes WebSockets
        (`ACCOUNT_DELETED`). Star financial records are kept by user ID only (see /privacy). Limited to
        10 password attempts per 15 minutes per user. Body max 8 KB.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  format: password
                google_id_token:
                  type: string
                  description: Alternative to password for Google-linked accounts.
      responses:
        '200':
          description: Account deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  message:
                    type: string
        '400':
          description: Neither password nor google_id_token given
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Wrong password (INVALID_CREDENTIALS) or Google re-auth failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Account not found
        '429':
          description: Too many password attempts
        '501':
          description: Account deletion not wired on this server

  /api/auth/me/google:
    post:
      tags:
        - Authentication & Identity
      summary: Link Google to the Signed-in Account
      description: Body `{"id_token"}` of the Google account to link. Limited with the password-attempt limiter.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_token]
              properties:
                id_token:
                  type: string
      responses:
        '200':
          description: Linked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleManageResult'
        '409':
          description: ACCOUNT_ALREADY_HAS_GOOGLE or GOOGLE_LINKED_TO_OTHER_ACCOUNT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: VALIDATION_ERROR (bad payload) or GOOGLE_SAME_ACCOUNT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: GOOGLE_TOKEN_INVALID, GOOGLE_REAUTH_STALE, GOOGLE_MISMATCH, LINK_TOKEN_INVALID or INVALID_CREDENTIALS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: GOOGLE_NOT_CONFIGURED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - Authentication & Identity
      summary: Replace the Linked Google Account
      description: Needs proof of both accounts. Replacements are rate-limited (429 GOOGLE_REPLACE_LIMIT).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_id_token, id_token]
              properties:
                old_id_token:
                  type: string
                  description: ID token of the currently linked Google account
                id_token:
                  type: string
                  description: ID token of the new Google account
      responses:
        '200':
          description: Replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleManageResult'
        '404':
          description: GOOGLE_NOT_LINKED
        '409':
          description: GOOGLE_LINKED_TO_OTHER_ACCOUNT
        '429':
          description: GOOGLE_REPLACE_LIMIT
        '400':
          description: VALIDATION_ERROR (bad payload) or GOOGLE_SAME_ACCOUNT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: GOOGLE_TOKEN_INVALID, GOOGLE_REAUTH_STALE, GOOGLE_MISMATCH, LINK_TOKEN_INVALID or INVALID_CREDENTIALS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: GOOGLE_NOT_CONFIGURED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Authentication & Identity
      summary: Unlink Google
      description: Requires the account password. Accounts without a password get 409 PASSWORD_LOGIN_UNAVAILABLE.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Unlinked (`google_linked` false)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleManageResult'
        '404':
          description: GOOGLE_NOT_LINKED
        '409':
          description: PASSWORD_LOGIN_UNAVAILABLE
        '400':
          description: VALIDATION_ERROR (bad payload) or GOOGLE_SAME_ACCOUNT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: GOOGLE_TOKEN_INVALID, GOOGLE_REAUTH_STALE, GOOGLE_MISMATCH, LINK_TOKEN_INVALID or INVALID_CREDENTIALS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: GOOGLE_NOT_CONFIGURED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/google:
    post:
      tags:
        - Authentication & Identity
      summary: Sign In with Google
      description: |
        Exchanges a Google ID token for a session. If the Google account is not linked yet, answers 200 with
        `code: GOOGLE_NOT_LINKED` and a `link_token` for /api/auth/google/register or /api/auth/google/link.
        Shares the per-IP auth rate limiter with password login. Body max 16 KB.
      parameters:
        - $ref: '#/components/parameters/HeaderTenantID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/DeviceFields'
                - type: object
                  required:
                    - id_token
                  properties:
                    id_token:
                      type: string
      responses:
        '200':
          description: Session, or GOOGLE_NOT_LINKED with a link_token
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AuthTokenResponse'
                  - $ref: '#/components/schemas/GoogleLinkPending'
        '403':
          description: ACCOUNT_SUSPENDED or GOOGLE_TENANT_NOT_ALLOWED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: DEVICE_LIMIT_REACHED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceLimitConflict'
        '429':
          description: Rate limit exceeded
        '400':
          description: VALIDATION_ERROR (bad payload) or GOOGLE_SAME_ACCOUNT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: GOOGLE_TOKEN_INVALID, GOOGLE_REAUTH_STALE, GOOGLE_MISMATCH, LINK_TOKEN_INVALID or INVALID_CREDENTIALS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: GOOGLE_NOT_CONFIGURED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/google/register:
    post:
      tags:
        - Authentication & Identity
      summary: Create a New Account from a Google link_token
      description: Creates a password-less account. Returns the session with 201.
      parameters:
        - $ref: '#/components/parameters/HeaderTenantID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/DeviceFields'
                - type: object
                  required:
                    - link_token
                    - username
                  properties:
                    link_token:
                      type: string
                    username:
                      type: string
                    display_name:
                      type: string
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '403':
          description: GOOGLE_TENANT_NOT_ALLOWED
        '409':
          description: USERNAME_TAKEN or GOOGLE_LINKED_TO_OTHER_ACCOUNT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded
        '400':
          description: VALIDATION_ERROR (bad payload) or GOOGLE_SAME_ACCOUNT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: GOOGLE_TOKEN_INVALID, GOOGLE_REAUTH_STALE, GOOGLE_MISMATCH, LINK_TOKEN_INVALID or INVALID_CREDENTIALS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: GOOGLE_NOT_CONFIGURED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/google/link:
    post:
      tags:
        - Authentication & Identity
      summary: Link Google to an Existing Account (username + password) and Sign In
      parameters:
        - $ref: '#/components/parameters/HeaderTenantID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/DeviceFields'
                - type: object
                  required:
                    - link_token
                    - username
                    - password
                  properties:
                    link_token:
                      type: string
                    username:
                      type: string
                    password:
                      type: string
                      format: password
      responses:
        '200':
          description: Linked and signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '403':
          description: ACCOUNT_SUSPENDED
        '409':
          description: DEVICE_LIMIT_REACHED (DeviceLimitConflict), ACCOUNT_ALREADY_HAS_GOOGLE or GOOGLE_LINKED_TO_OTHER_ACCOUNT
        '429':
          description: Rate limit exceeded
        '400':
          description: VALIDATION_ERROR (bad payload) or GOOGLE_SAME_ACCOUNT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: GOOGLE_TOKEN_INVALID, GOOGLE_REAUTH_STALE, GOOGLE_MISMATCH, LINK_TOKEN_INVALID or INVALID_CREDENTIALS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: GOOGLE_NOT_CONFIGURED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/credentials:
    get:
      tags:
        - Authentication & Identity
      summary: List the Caller's Login Credentials
      description: Credential records (password, oauth, passkey). Secrets are never returned. Empty array when none.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Credentials
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    user_id:
                      type: string
                    type:
                      type: string
                      enum: [password, passkey, oauth]
                    identifier:
                      type: string
                      description: username, email or credential ID
                    name:
                      type: string
                    created_at:
                      type: string
                      format: date-time
                    updated_at:
                      type: string
                      format: date-time
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/refresh:
    post:
      tags:
        - Authentication & Identity
      summary: Refresh Token (Sliding Renewal)
      description: >
        Issues a new JWT (new JTI, full 30-day lifetime) when the current token has less than 50% of its lifetime
        left. Otherwise returns `refreshed=false` and the client keeps its token. Sessions are capped at 365 days
        since the original login (`auth_time`). The old token is left to expire naturally; its session record is
        revoked. Revoked/expired tokens are rejected with 401 before reaching this handler.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Refresh result
          content:
            application/json:
              schema:
                type: object
                properties:
                  refreshed:
                    type: boolean
                  token:
                    type: string
                    description: Present only when refreshed=true
                  expires_at:
                    type: string
                    format: date-time
        '401':
          description: Token invalid/revoked, session inactive, or absolute session age (365 days) exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/logout:
    post:
      tags:
        - Authentication & Identity
      summary: Logout & Revoke Current Session
      description: Revokes the current JWT session and blacklists its JTI token. The device to sign out comes from the `X-Device-ID` header, or from an optional JSON body when the header is missing.
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                device_id:
                  type: string
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  message:
                    type: string
                    example: Logged out successfully
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/sessions:
    get:
      tags:
        - Authentication & Identity
      summary: List Active Sessions
      description: Retrieves all active sessions for the authenticated user across devices.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Active sessions list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Session'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/sessions/{id}:
    delete:
      tags:
        - Authentication & Identity
      summary: Revoke a Specific Session
      description: Forcefully terminates a specific session by its session ID.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Session UUID to revoke
          schema:
            type: string
      responses:
        '200':
          description: Session revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        '404':
          description: Session not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/sessions/revoke-others:
    post:
      tags:
        - Authentication & Identity
      summary: Revoke All Other Active Sessions
      description: Terminates all active sessions except the current caller session.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Other sessions revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  revoked_count:
                    type: integer
                    example: 1

  /api/auth/devices:
    get:
      tags:
        - Authentication & Identity
      summary: List Registered Devices
      description: Returns list of devices registered under the user account.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Devices list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Device'

  /api/auth/devices/{id}:
    delete:
      tags:
        - Authentication & Identity
      summary: Unregister Device
      description: Removes a registered device and revokes its associated tokens.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Device ID or UUID
          schema:
            type: string
      responses:
        '200':
          description: Device removed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/auth/profile:
    put:
      tags:
        - Authentication & Identity
      summary: Update User Profile
      description: Updates display name, status bio, and avatar image URL.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Fields sent replace the stored values (send the current value to keep it). POST is accepted as an alias of PUT.
              properties:
                display_name:
                  type: string
                status_message:
                  type: string
                avatar_url:
                  type: string
                bio:
                  type: string
                role:
                  type: string
                metadata:
                  type: object
                  additionalProperties: true
                is_private_account:
                  type: boolean
                  description: Omit to leave unchanged.
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /api/auth/verify-password:
    post:
      tags:
        - Authentication & Identity
      summary: Verify User Password
      description: Pre-flight check to verify current password before high-privilege operations.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                password:
                  type: string
                  format: password
                  example: secret12345
      responses:
        '200':
          description: Password verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                    example: true
        '400':
          description: Invalid password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/change-password:
    post:
      tags:
        - Authentication & Identity
      summary: Change Password
      description: Updates user password and revokes all active sessions except the current one.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - old_password
                - new_password
              properties:
                old_password:
                  type: string
                  format: password
                new_password:
                  type: string
                  format: password
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/auth/public-key:
    get:
      tags:
        - Authentication & Identity
      summary: Fetch E2EE Public Key of a User
      description: Retrieves the public key and key_version of a specified user for ECDH secret agreement.
      security: []
      parameters:
        - name: id
          in: query
          required: false
          description: Target user ID or username (leading @ allowed). One of id / username is required. No authentication needed.
          schema:
            type: string
        - name: username
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Public key details
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: string
                  public_key:
                    type: string
                    description: Base64-encoded raw uncompressed P-256 public key
    put:
      tags:
        - Authentication & Identity
      summary: Update Authenticated User Public Key
      description: Sets or updates the user's ECDH P-256 public key.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Registers the caller's E2EE public key. The server assigns `key_version` (returned in the response). POST is accepted as an alias of PUT.
              required:
                - public_key
              properties:
                public_key:
                  type: string
                device_id:
                  type: string
      responses:
        '200':
          description: Public key updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/users/public-key:
    $ref: '#/paths/~1api~1auth~1public-key'

  /api/users/public-key/reset:
    $ref: '#/paths/~1api~1user~1public-key~1reset'

  /api/user/public-key/reset:
    post:
      tags:
        - Authentication & Identity
      summary: Force Reset E2EE Public Key
      description: Increments the user's `key_version` and stores a fresh public key when migrating to a new primary device without key backup.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Replaces the key after re-authentication (`password`, or `google_id_token` for Google-linked accounts). Revokes the caller's other sessions. Messages encrypted to the old key become unreadable.
              required:
                - public_key
              properties:
                public_key:
                  type: string
                device_id:
                  type: string
                password:
                  type: string
                  format: password
                google_id_token:
                  type: string
      responses:
        '200':
          description: Public key reset and version incremented
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  key_version:
                    type: integer
                    example: 2

