        - AI Memory Engine
      summary: Get Published Memory Detail
      description: Fetches full memory snapshot and increments member view counter.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Published memory details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovedMemory'

  # =========================================================================
  # 10. PUSH NOTIFICATIONS
  # =========================================================================
  /api/notifications/vapid-public-key:
    get:
      tags:
        - Push Notifications
      summary: Get VAPID Public Key for Web Push
      description: Returns the base64 URL-safe VAPID application server public key for browser push subscription handshake.
      responses:
        '200':
          description: VAPID public key
          content:
            application/json:
              schema:
                type: object
                properties:
                  public_key:
                    type: string
                    example: BNq1L6_Q...

  /api/notifications/subscribe:
    post:
      tags:
        - Push Notifications
      summary: Register Push Notification Subscription
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushSubscription'
      responses:
        '200':
          description: Subscribed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/notifications/unsubscribe:
    post:
      tags:
        - Push Notifications
      summary: Unsubscribe from Push Notifications
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - endpoint
              properties:
                endpoint:
                  type: string
      responses:
        '200':
          description: Unsubscribed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  # =========================================================================
  # 11. UTILITY & DIAGNOSTICS
  # =========================================================================
  /health:
    get:
      tags:
        - Utility & Diagnostics
      summary: Health Check & Readiness Probe
      description: Probe used by load balancers, orchestrators (Kubernetes), and uptime monitors.
      responses:
        '200':
          description: Server operational
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheck'

  /api/config:
    get:
      tags:
        - Utility & Diagnostics
      summary: Public Client Configuration
      description: Returns client environment config including max file upload limits and allowed MIME types.
      responses:
        '200':
          description: Configuration parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  max_upload_size:
                    type: integer
                    example: 26214400
                  allowed_types:
                    type: array
                    items:
                      type: string
                    example: ["image/jpeg", "image/png", "application/pdf"]

  /api/link-preview:
    get:
      tags:
        - Utility & Diagnostics
      summary: Fetch OpenGraph Metadata for Link Preview
      security:
        - BearerAuth: []
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OpenGraph metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkPreview'

  # =========================================================================
  # 11b. WUZZ GRID (DAILY GAME)
  # =========================================================================
  /api/game/today:
    get:
      tags:
        - Wuzz Grid (Daily Game)
      summary: Today's puzzle, attempt and streak
      description: |
        Returns today's puzzle for the caller's LOCAL calendar date (timezone from `/api/game/settings`, default `Asia/Jakarta`), the caller's attempt (absent until started) and streak. The solution is never returned.

        When the feature is switched off (`GAME_ENABLED` unset) the response is `200 {"enabled": false}` so clients can hide the entry card; every other game endpoint then returns `403`.

        All `/api/game/*` endpoints are rate limited to 60 requests per minute per user (`429` with `Retry-After: 60`).
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Puzzle, attempt and streak
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameToday'
        '401':
          $ref: '#/components/responses/GameUnauthorized'
        '429':
          $ref: '#/components/responses/GameRateLimited'

  /api/game/today/start:
    post:
      tags:
        - Wuzz Grid (Daily Game)
      summary: Start today's attempt
      description: Records the start time on the server. Idempotent; calling again never changes `started_at`.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Same shape as `GET /api/game/today`, with `attempt.status = playing`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameToday'
        '401':
          $ref: '#/components/responses/GameUnauthorized'
        '403':
          $ref: '#/components/responses/GameDisabled'
        '429':
          $ref: '#/components/responses/GameRateLimited'

  /api/game/today/submit:
    post:
      tags:
        - Wuzz Grid (Daily Game)
      summary: Submit a placement for today's puzzle
      description: |
        Validates the placement against the rules. Completion time is `solved_at - started_at` computed on the server. A complete but wrong placement increments `mistakes`; an incomplete one does not. Idempotent after completion: re-sending returns the same result and never counts the streak twice.

        A solve faster than `0.5s x size` is marked `suspicious` (excluded from leaderboards and streak).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameSubmitRequest'
      responses:
        '200':
          description: Result of the submission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameSubmitResult'
        '400':
          description: Malformed body, wrong length, or a column outside the grid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameError'
        '401':
          $ref: '#/components/responses/GameUnauthorized'
        '403':
          $ref: '#/components/responses/GameDisabled'
        '409':
          description: Attempt not started yet (call `start` first) or the day rolled over
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameError'
        '429':
          $ref: '#/components/responses/GameRateLimited'

  /api/game/leaderboard:
    get:
      tags:
        - Wuzz Grid (Daily Game)
      summary: Leaderboard (friends, group or public)
      description: |
        Up to 50 rows; only `solved` attempts count. Ordering: `day` = fastest time; `week` (Monday to today, caller's local dates) = most days solved, then lowest total time. Equal results share a rank.

        Filtering: users with a block relation to the caller (either direction) are excluded; owners with `hide_from_social` are excluded from other people's `friends` and `group` boards (their own row stays visible to them). The `public` board only lists users who opted in and were not removed by staff, and **never carries `display_name` or `avatar_url`**.
      security:
        - BearerAuth: []
      parameters:
        - name: scope
          in: query
          required: true
          description: friends = caller plus accepted connections; group = members of one parent group; public = opted-in players
          schema:
            type: string
            enum: [friends, group, public]
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [day, week]
            default: day
        - name: group_id
          in: query
          required: false
          description: Required when scope=group. Must start with `grp_` (forums `sub_` and direct chats are rejected).
          schema:
            type: string
            example: grp_3f2c1a9e-0000-0000-0000-000000000000
      responses:
        '200':
          description: Leaderboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameLeaderboard'
        '400':
          description: Unknown scope or period, or missing/invalid group_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameError'
        '401':
          $ref: '#/components/responses/GameUnauthorized'
        '403':
          description: Feature disabled, or the caller is not a member of the requested group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameError'
        '429':
          $ref: '#/components/responses/GameRateLimited'

  /api/game/settings:
    get:
      tags:
        - Wuzz Grid (Daily Game)
      summary: Get game preferences
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current preferences (defaults when never saved)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameSettings'
        '401':
          $ref: '#/components/responses/GameUnauthorized'
        '403':
          $ref: '#/components/responses/GameDisabled'
        '429':
          $ref: '#/components/responses/GameRateLimited'
    put:
      tags:
        - Wuzz Grid (Daily Game)
      summary: Update game preferences (partial)
      description: Fields that are not sent are left unchanged. After a timezone has been changed once, it can only be changed again after 24 hours (prevents using it to extend a streak).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameSettingsUpdate'
      responses:
        '200':
          description: Preferences after the update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameSettings'
        '400':
          description: Invalid IANA timezone or malformed body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameError'
        '401':
          $ref: '#/components/responses/GameUnauthorized'
        '403':
          $ref: '#/components/responses/GameDisabled'
        '409':
          description: Timezone is locked for 24 hours after the previous change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameError'
        '429':
          $ref: '#/components/responses/GameRateLimited'

  /api/admin/users/{id}/game-board:
    parameters:
      - name: id
        in: path
        required: true
        description: Target user ID
        schema:
          type: string
    get:
      tags:
        - Wuzz Grid (Daily Game)
      summary: "Staff: is the user hidden from the public board?"
      description: Staff only (`wuzz_moderator` or `wuzz_admin`).
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current moderation state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameBoardHidden'
        '401':
          $ref: '#/components/responses/GameUnauthorized'
        '403':
          description: Caller is not staff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameError'
        '404':
          description: User not found, or the game module is not installed on this server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameError'
    post:
      tags:
        - Wuzz Grid (Daily Game)
      summary: "Staff: hide or restore a user on the public board"
      description: |
        Removes (or restores) the user from the PUBLIC board only; the account and the friends/group boards are untouched. A note is mandatory when hiding (max 500 characters) and every action is written to an append-only audit table. Idempotent.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameBoardHideRequest'
      responses:
        '200':
          description: New moderation state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameBoardHidden'
        '400':
          description: Missing note when hiding, note too long, or malformed body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameError'
        '401':
          $ref: '#/components/responses/GameUnauthorized'
        '403':
          description: Caller is not staff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameError'
        '404':
          description: User not found, or the game module is not installed on this server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameError'
        '409':
          description: Account already deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameError'

  # =========================================================================
  # 12. DOCUMENTATION ENDPOINTS
  # =========================================================================
  /api/openapi.yaml:
    get:
      tags:
        - Utility & Diagnostics
      summary: Raw OpenAPI 3.1.0 Specification
      description: Serves the canonical OpenAPI 3.1.0 specification file in YAML format.
      responses:
        '200':
          description: Raw YAML specification
          content:
            application/yaml:
              schema:
                type: string

  /api/docs:
    get:
      tags:
        - Utility & Diagnostics
      summary: Self-Hosted Interactive API Documentation UI
      description: Embedded web UI rendering OpenAPI documentation with zero external cloud dependencies.
      responses:
        '200':
          description: Interactive documentation webpage
          content:
            text/html:
              schema:
                type: string

components:
  parameters:
    HeaderTenantID:
      name: X-Tenant-ID
      in: header
      required: false
      description: Optional tenant identifier. Falls back to JWT claims or 'default'.
      schema:
        type: string
        default: default

  responses:
    GameUnauthorized:
      description: Missing, invalid or expired session
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GameError'
    GameDisabled:
      description: The game feature is switched off on this server (`GAME_ENABLED`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GameError'
    GameRateLimited:
      description: More than 60 game requests per minute for this user. Retry after the `Retry-After` header (seconds).
      headers:
        Retry-After:
          schema:
            type: integer
            example: 60
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GameError'

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Standard 30-day session token passed as Authorization: Bearer <token>."
    B2BAppID:
      type: apiKey
      in: header
      name: X-App-ID
      description: Third-party tenant application ID.
    B2BAppSecret:
      type: apiKey
      in: header
      name: X-App-Secret
      description: Third-party tenant secret key.

  schemas:
    ProblemDetails:
      type: object
      description: Standardized error envelope adhering to RFC 7807 Problem Details for HTTP APIs.
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          example: https://wuzzhub.id/errors/unauthorized
        title:
          type: string
          example: Unauthorized
        status:
          type: integer
          example: 401
        detail:
          type: string
          example: Invalid or expired Bearer token provided
        instance:
          type: string
          example: /api/conversations

    Tenant:
      type: object
      properties:
        id:
          type: string
          example: b2b_tenant_alpha
        name:
          type: string
          example: Enterprise Alpha
        slug:
          type: string
          example: enterprise-alpha
        status:
          type: string
          enum: [active, suspended, inactive]
          example: active
        created_at:
          type: string
          format: date-time

    User:
      type: object
      properties:
        id:
          type: string
          example: usr_abc12345
        tenant_id:
          type: string
          example: default
        username:
          type: string
          example: johndoe
        display_name:
          type: string
          example: John Doe
        avatar_url:
          type: string
          example: /uploads/avatar.png
        status:
          type: string
          example: Available
        public_key:
          type: string
          description: Base64 raw ECDH P-256 public key
        key_version:
          type: integer
          example: 1
        created_at:
          type: string
          format: date-time

    RegisterRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: alice
        password:
          type: string
          format: password
          example: StrongPassw0rd!
        display_name:
          type: string
          example: Alice
        public_key:
          type: string
        key_version:
          type: integer
          default: 1

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: alice
        password:
          type: string
          format: password
          example: StrongPassw0rd!
        device_id:
          type: string
          example: dev_mobile_pixel8
        device_name:
          type: string
          example: Pixel 8 Pro

    AuthTokenResponse:
      type: object
      properties:
        token:
          type: string
          description: 30-day session JWT
        user:
          $ref: '#/components/schemas/User'
        expires_in:
          type: integer
          example: 604800

    ProvisionTokenRequest:
      type: object
      required:
        - user_id
        - username
      properties:
        user_id:
          type: string
          description: Partner platform external user UUID
          example: ext_u_12345
        username:
          type: string
          example: partner_user
        display_name:
          type: string
          example: Partner User
        avatar_url:
          type: string
          example: https://partner.com/avatars/user.jpg
        role:
          type: string
          example: member

    ProvisionTokenResponse:
      type: object
      properties:
        exchange_token:
          type: string
          description: Ephemeral 60-second single-use exchange token
        expires_in:
          type: integer
          example: 60

    ExchangeTokenRequest:
      type: object
      required:
        - exchange_token
      properties:
        exchange_token:
          type: string
        device_id:
          type: string
          example: mobile_ios_17
        device_name:
          type: string
          example: iPhone 15 Pro

    Session:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        device_id:
          type: string
        device_name:
          type: string
        ip_address:
          type: string
        is_current:
          type: boolean
        last_active_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    Device:
      type: object
      properties:
        id:
          type: string
        device_id:
          type: string
        device_name:
          type: string
        last_seen_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    Conversation:
      type: object
      properties:
        id:
          type: string
        room_id:
          type: string
          example: dm_default_usrA_usrB
        name:
          type: string
          example: Alice Smith
        type:
          type: string
          enum: [direct, group, subgroup]
          example: direct
        is_group:
          type: boolean
        is_subgroup:
          type: boolean
        unread_count:
          type: integer
          example: 0
        pinned:
          type: boolean
        last_message:
          $ref: '#/components/schemas/Message'
        participants:
          type: array
          items:
            $ref: '#/components/schemas/User'
        updated_at:
          type: string
          format: date-time

    Message:
      type: object
      properties:
        id:
          type: string
        room_id:
          type: string
        sender_id:
          type: string
        content:
          type: string
          description: Ciphertext string (if E2EE) or plain text
        type:
          type: string
          enum: [text, image, file, audio, system]
          example: text
        status:
          type: string
          enum: [sent, delivered, read]
          example: read
        media_url:
          type: string
        reply_to_id:
          type: string
        reactions:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        is_pinned:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MediaUploadResponse:
      type: object
      properties:
        id:
          type: string
        filename:
          type: string
        original_name:
          type: string
        mime_type:
          type: string
        size:
          type: integer
        url:
          type: string
        hash_sha256:
          type: string

    CreateGroupRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: Engineering Core
        description:
          type: string
          example: Architecture & Core Platform
        avatar_url:
          type: string
        type:
          type: string
          enum: [public, private]
          default: private

    Group:
      type: object
      properties:
        id:
          type: string
        tenant_id:
          type: string
        name:
          type: string
        description:
          type: string
        avatar_url:
          type: string
        type:
          type: string
        created_by:
          type: string
        members_count:
          type: integer
        subgroups_count:
          type: integer
        created_at:
          type: string
          format: date-time

    GroupMember:
      type: object
      properties:
        user_id:
          type: string
        group_id:
          type: string
        role:
          type: string
          enum: [admin, member]
        joined_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/User'

    CreateSubgroupRequest:
      type: object
      description: |
        Payload `POST /api/groups/{id}/subgroups` (sesuai `handleCreateSubGroup`). Hanya admin atau pembuat grup induk.
        Durasi memakai SATU daftar di server (`store.SubGroupDurationDays`); selain nilai di bawah ditolak 400.
        Dengan `FORUM_LIMITS_ENABLED`, paket Gratis hanya boleh 7 hari (30 hari ditolak 403 `duration_not_in_plan`).
      required:
        - title
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 128
          example: Incident-2026-09
        description:
          type: string
          maxLength: 500
          example: Post-mortem war room
        duration:
          type: string
          description: Masa aktif forum. Kosong = 7_days. Alias yang diterima server tercantum di enum.
          enum: [7_days, 7d, 1_week, week, 30_days, 30d, 1_month, month]
          default: 7_days
          example: 7_days
        is_public:
          type: boolean
          description: true = anggota grup induk langsung bergabung; false = perlu izin admin. Default true.
          default: true

    Subgroup:
      type: object
      properties:
        id:
          type: string
        parent_group_id:
          type: string
        name:
          type: string
        description:
          type: string
        expires_at:
          type: string
          format: date-time
        is_expired:
          type: boolean
        created_by:
          type: string
        created_at:
          type: string
          format: date-time

    JoinRequest:
      type: object
      properties:
        id:
          type: string
        group_id:
          type: string
        user_id:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected]
        created_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/User'

    MemoryArtifact:
      type: object
      properties:
        id:
          type: string
        draft_id:
          type: string
        type:
          type: string
          enum: [decision, action_item, key_takeaway, journey_lite]
        title:
          type: string
        content:
          type: string
        metadata:
          type: object

    MemoryDraft:
      type: object
      properties:
        id:
          type: string
        group_id:
          type: string
        subgroup_id:
          type: string
        title:
          type: string
        summary:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected]
        confidence_score:
          type: number
          example: 0.94
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/MemoryArtifact'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ApprovedMemory:
      type: object
      properties:
        id:
          type: string
        group_id:
          type: string
        title:
          type: string
        summary:
          type: string
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/MemoryArtifact'
        views_count:
          type: integer
        approved_by:
          type: string
        published_at:
          type: string
          format: date-time

    PushSubscription:
      type: object
      required:
        - endpoint
        - keys
      properties:
        endpoint:
          type: string
        keys:
          type: object
          required:
            - p256dh
            - auth
          properties:
            p256dh:
              type: string
            auth:
              type: string

    HealthCheck:
      type: object
      properties:
        status:
          type: string
          example: ok
        time:
          type: string
          format: date-time

    LinkPreview:
      type: object
      properties:
        url:
          type: string
        title:
          type: string
        description:
          type: string
        image:
          type: string
        site_name:
          type: string

    # ---------------------------------------------------------------------
    # Wuzz Grid (Daily Game)
    # ---------------------------------------------------------------------
    GameError:
      type: object
      description: 'Error envelope used by the game endpoints: a plain object with a single "error" string (not RFC 7807).'
      required: [error]
      properties:
        error:
          type: string
          example: fitur game belum aktif

    GamePuzzle:
      type: object
      description: Today's puzzle. The solution is never included.
      required: [date, size, regions, seed]
      properties:
        date:
          type: string
          description: Local calendar date of the player the puzzle belongs to
          example: '2026-10-27'
        size:
          type: integer
          minimum: 6
          maximum: 9
          description: Grid size N (Mon-Tue 6, Wed-Thu 7, Fri-Sat 8, Sun 9)
        regions:
          type: array
          description: regions[row][col] = region number 0..N-1; each region is connected
          items:
            type: array
            items:
              type: integer
          example: [[4,4,3,3,3,3],[4,1,1,1,5,3],[0,1,0,0,5,3],[0,0,0,5,5,3],[0,0,0,5,2,2],[0,0,0,0,2,2]]
        seed:
          type: integer
          format: int64

    GameAttempt:
      type: object
      required: [puzzle_date, started_at, duration_ms, mistakes, status]
      properties:
        puzzle_date:
          type: string
          example: '2026-10-27'
        started_at:
          type: string
          format: date-time
        solved_at:
          type: string
          format: date-time
        duration_ms:
          type: integer
          format: int64
          description: Server-computed completion time; 0 while playing
        mistakes:
          type: integer
          description: Complete-but-wrong submissions
        status:
          type: string
          enum: [playing, solved, suspicious]

    GameStreak:
      type: object
      required: [current, best, freezes_available]
      properties:
        current:
          type: integer
          description: Consecutive days solved (shown as 0 once it is certainly broken)
        best:
          type: integer
        last_solved_date:
          type: string
          example: '2026-10-27'
        freezes_available:
          type: integer
          description: One free freeze per local week; used automatically when exactly one day is missed

    GameToday:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: false when the feature is switched off server-side (all other fields are then absent)
        puzzle:
          $ref: '#/components/schemas/GamePuzzle'
        number:
          type: integer
          description: Shareable puzzle number ("Wuzz Grid #N"); number 1 is 2026-10-25
        attempt:
          $ref: '#/components/schemas/GameAttempt'
        streak:
          $ref: '#/components/schemas/GameStreak'
        reminder_time:
          type: string
          description: Daily reminder time HH:MM in the device's local time, set by the server (`GAME_REMINDER_TIME`, default 19:00)
          example: '19:00'

    GameSubmitRequest:
      type: object
      required: [placement]
      properties:
        placement:
          type: array
          description: placement[row] = column of the star on that row, or -1 when the row is empty. Length must equal `size`.
          items:
            type: integer
            minimum: -1
          example: [1, 3, 5, 2, 0, 4]

    GameSubmitResult:
      type: object
      required: [solved, attempt]
      properties:
        solved:
          type: boolean
        attempt:
          $ref: '#/components/schemas/GameAttempt'
        streak:
          $ref: '#/components/schemas/GameStreak'

    GameBoardEntry:
      type: object
      required: [rank, user_id, username, solved_days, duration_ms, is_me]
      properties:
        rank:
          type: integer
        user_id:
          type: string
        username:
          type: string
        display_name:
          type: string
          description: Empty on the public board
        avatar_url:
          type: string
          description: Never present on the public board
        solved_days:
          type: integer
          description: Day period - always 1. Week period - days solved
        duration_ms:
          type: integer
          format: int64
          description: Day period - completion time. Week period - total time of the solved days
        is_me:
          type: boolean

    GameLeaderboard:
      type: object
      required: [scope, period, from, to, entries]
      properties:
        scope:
          type: string
          enum: [friends, group, public]
        period:
          type: string
          enum: [day, week]
        from:
          type: string
          example: '2026-10-26'
        to:
          type: string
          example: '2026-10-27'
        entries:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/GameBoardEntry'
        my_rank:
          type: integer
          description: Absent when the caller does not appear on this board

    GameSettings:
      type: object
      required: [leaderboard_public, reminder_enabled, hide_from_social, timezone]
      properties:
        leaderboard_public:
          type: boolean
          description: Appear on the public board as `@username` + time (default false)
        reminder_enabled:
          type: boolean
          description: Account-level record of the reminder choice. The reminder itself is a local notification scheduled by the app.
        hide_from_social:
          type: boolean
          description: Hide results from other people's friends and group boards (default false = visible)
        timezone:
          type: string
          description: IANA timezone name used to decide the player's local day
          example: Asia/Jakarta

    GameSettingsUpdate:
      type: object
      description: All fields optional; fields not sent are unchanged.
      properties:
        leaderboard_public:
          type: boolean
        reminder_enabled:
          type: boolean
        hide_from_social:
          type: boolean
        timezone:
          type: string
          example: Asia/Makassar

    GameBoardHideRequest:
      type: object
      required: [hidden]
      properties:
        hidden:
          type: boolean
        note:
          type: string
          maxLength: 500
          description: Required when hidden is true; recorded in the audit trail

    GameBoardHidden:
      type: object
      required: [hidden]
      properties:
        hidden:
          type: boolean
