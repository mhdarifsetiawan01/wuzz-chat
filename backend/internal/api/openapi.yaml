          schema:
            type: string
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [none, pending, accepted, declined, blocked]
                  direction:
                    type: string
                    enum: [incoming, outgoing, '']
                  connection_id:
                    type: string
                  is_private_account:
                    type: boolean
                  can_message:
                    type: boolean
                  can_call:
                    type: boolean
                  blocked_by_me:
                    type: boolean
                  blocked_by_them:
                    type: boolean

  /api/connections/block:
    post:
      tags:
        - Connections
      security:
        - BearerAuth: []
      summary: Block a User
      description: 30 block/unblock actions per hour per user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id:
                  type: string
      responses:
        '200':
          description: 'Blocked'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: 'user_id missing or block failed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Block rate limit

  /api/connections/block/{userId}:
    delete:
      tags:
        - Connections
      security:
        - BearerAuth: []
      summary: Unblock a User
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Unblocked'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '404':
          description: 'User is not blocked by the caller'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Block rate limit

  /api/connections/{userId}:
    delete:
      tags:
        - Connections
      security:
        - BearerAuth: []
      summary: Unfriend a User
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'Friendship removed'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /api/groups:
    post:
      tags:
        - Groups & Communities
      summary: Create New Group
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupRequest'
      responses:
        '201':
          description: Group created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'

  /api/groups/search:
    get:
      tags:
        - Groups & Communities
      summary: Search Public Groups
      security:
        - BearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Matching public groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Group'

  /api/groups/{id}:
    get:
      tags:
        - Groups & Communities
      summary: Get Group Details
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Group details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
    patch:
      tags:
        - Groups & Communities
      summary: Update Group Metadata
      description: Update name, description, avatar, or settings (Admin only).
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                avatar_url:
                  type: string
      responses:
        '200':
          description: Group updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'

  /api/links:
    post:
      tags:
        - Groups & Communities
      summary: Get or Create Short Link
      description: >
        Returns the short link code of a group (grp_) or forum topic (sub_), creating it on first request.
        The code never changes once issued. Only members of the group may ask.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [room_id]
              properties:
                room_id:
                  type: string
                  example: grp_3f2b9c1e-0000-0000-0000-000000000000
      responses:
        '200':
          description: Short link code and public path
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: Ab3xK9qz
                  path:
                    type: string
                    description: "/g/{code} for groups, /sub/{code} for forum topics. Public URL is https://chat.wuzzhub.id{path}"
                    example: /g/Ab3xK9qz
        '403':
          description: >
            Caller is not a member of the group, or (code `admin_only`) the group is a private top-level group and the
            caller is not creator/admin. Private groups should be shared with an invite link instead.
        '404':
          description: Group not found or room_id is not a group/forum topic
        '503':
          description: Short link creation is disabled on this server (SHORT_LINKS_ENABLED off); code `short_links_disabled`. Clients fall back to the long link.

  /api/links/{code}:
    get:
      tags:
        - Groups & Communities
      summary: Resolve Short Link
      description: >
        Public (no token). Translates an 8-character short code into the group/forum ID. Access to the room is still
        enforced by the group endpoints (private groups reject non-members with 403). For a public top-level group the
        response also carries a `preview` (name and avatar) used by the web landing page; private groups and forum topics
        never include it. Rate limited per IP (60 requests/minute).
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Resolved room ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  room_id:
                    type: string
                  preview:
                    type: object
                    description: Only for public top-level groups
                    properties:
                      title:
                        type: string
                      avatar_url:
                        type: string
                        description: "https URL, relative path, or emoji:<char>; may be empty"
        '404':
          description: Unknown code or malformed code
        '429':
          description: Too many requests

  /api/groups/{id}/invite-link:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Top-level private group ID (grp_). Other IDs return 404.
    get:
      tags:
        - Groups & Communities
      summary: Get Private Group Invite Link (creator/admin)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Active invite link, or null when none exists or the group is public
          content:
            application/json:
              schema:
                type: object
                properties:
                  link:
                    nullable: true
                    allOf:
                      - $ref: '#/components/schemas/InviteLink'
        '403':
          description: Caller is not creator/admin (code `admin_only`)
        '404':
          description: Group not found
    post:
      tags:
        - Groups & Communities
      summary: Create or Reset Private Group Invite Link (creator/admin)
      description: >
        Without `reset`, returns the active link or creates one. With `{"reset": true}`, revokes the active link and
        creates a new one in one transaction (the old token immediately returns 404). At most one active link per group.
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reset:
                  type: boolean
      responses:
        '200':
          description: Active invite link
          content:
            application/json:
              schema:
                type: object
                properties:
                  link:
                    $ref: '#/components/schemas/InviteLink'
        '403':
          description: Caller is not creator/admin (code `admin_only`)
        '404':
          description: Group not found
        '409':
          description: Group is public (code `not_private`)
    delete:
      tags:
        - Groups & Communities
      summary: Disable Private Group Invite Link (creator/admin)
      description: Revokes the active link without a replacement. Pending join requests are kept for admins to decide.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 'Link disabled; body is `{"link": null}`'
        '403':
          description: Caller is not creator/admin (code `admin_only`)

  /api/invites/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
          pattern: '^[2-9a-km-np-zA-HJ-NP-Z]{16}$'
    get:
      tags:
        - Groups & Communities
      summary: Preview Private Group Invite
      description: >
        Login required. Unknown, malformed, revoked, public-group, and other-tenant tokens all return the same 404
        (`invite_not_found`). Rate limited to 60 requests/hour per user. Response is `Cache-Control: no-store`.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Group preview and caller status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitePreview'
        '404':
          description: Invite not valid (code `invite_not_found`)
        '429':
          description: Too many requests

  /api/invites/{token}/join:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
    post:
      tags:
        - Groups & Communities
      summary: Request to Join via Invite Link
      description: >
        Mode `approval`: creates (or reactivates) a pending join request and notifies the group's creator/admins.
        Idempotent: an existing pending request returns 202 again without a new notification. Rate limited to
        10 requests/hour per user.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Caller is already a member (`status` = `member`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteJoinResult'
        '202':
          description: Request is pending admin approval (`status` = `pending`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteJoinResult'
        '404':
          description: Invite not valid (code `invite_not_found`)
        '429':
          description: >
            `rejoin_cooldown` (rejected less than 24 hours ago; `Retry-After` header and `retry_after_seconds`),
            `too_many_pending` (group has 500 pending requests), or the per-user rate limit.

  /api/invites/{token}/request:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
    delete:
      tags:
        - Groups & Communities
      summary: Cancel Own Join Request
      description: Also works through a token that has since been revoked.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 'Request cancelled; body is `{"status": "none"}`'
        '404':
          description: No pending request (`request_not_found`) or invite not valid (`invite_not_found`)

  /api/me/stars:
    get:
      tags: [Stars]
      summary: My Star balance and history (STARS_ENABLED; 404 when off)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Balance and the 50 most recent ledger entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StarWallet'
        '404':
          description: Stars disabled

  /api/me/stars/packages:
    get:
      tags: [Stars]
      summary: Star packages sold through Google Play (STARS_PLAY_BILLING; 404 when off)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 'Body: {"packages": [{"product_id": "star_50", "stars": 50}], "account_id": "<SHA-256 of user id; pass as obfuscatedAccountId>"}'
        '404':
          description: Play billing disabled

  /api/me/stars/purchases:
    post:
      tags: [Stars]
      summary: Verify a Google Play purchase and credit Stars (idempotent per purchase token; 30/hour per user)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id, purchase_token]
              properties:
                product_id:
                  type: string
                purchase_token:
                  type: string
      responses:
        '200':
          description: 'Credited. Body: {"state": "credited", "stars_added", "balance", "debt"} (stars_added 0 when the token was already credited)'
        '202':
          description: 'Payment pending at Google (e.g. cash). Body: {"state": "pending", ...}'
        '400':
          description: 'unknown_product, invalid_purchase_token, product_mismatch'
        '403':
          description: purchase_account_mismatch (token bound to another account)
        '404':
          description: Play billing disabled
        '409':
          description: purchase_cancelled
        '502':
          description: play_unavailable (Google Play API error)

  /api/me/stars/creator-application:
    get:
      tags: [Stars]
      summary: Caller's "become a Creator" application status (PAID_GROUPS_ENABLED; 404 when off)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: >
            Body: {"is_creator": bool, "application": {"id","status": "pending|approved|rejected","message","decision_note",
            "decided_at","created_at"} | null, "can_apply": bool, "retry_at"?: RFC3339 (rejected, 7-day re-apply wait)}
        '404':
          description: Paid groups disabled
    post:
      tags: [Stars]
      summary: Apply to become a Creator (reviewed by wuzz_admin; approval grants partner creator)
      description: 'Body {"message": 10-500 chars}. Rate limit 5/hour per user. Staff are notified (Telegram) without user data.'
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Created; body is the same state object as GET
        '400':
          description: message_invalid
        '409':
          description: application_pending | already_creator
        '429':
          description: 'reapply_cooldown (Retry-After header; body {"retry_at","retry_after_seconds"}) or rate limit'

  /api/me/stars/received:
    get:
      tags: [Stars]
      summary: Stars received by a partner creator, per group
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 'Body: {"is_creator": bool, "groups": [...]}; refunded purchases excluded'

  /api/groups/{id}/paid:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Stars]
      summary: Paid group settings (PAID_GROUPS_ENABLED)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 'Body: {"paid": PaidGroup|null, "is_creator", "price_min", "price_max"}'
    put:
      tags: [Stars]
      summary: Set price and enable/disable a paid group (group creator who is an active partner creator)
      description: Changing the paid status resets the active invite link so its mode follows (old link stops working).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [price_stars, enabled]
              properties:
                price_stars:
                  type: integer
                enabled:
                  type: boolean
      responses:
        '200':
          description: Saved
        '400':
          description: price_out_of_range
        '403':
          description: not_group_creator or not_paid_creator
        '409':
          description: not_private

  /api/invites/{token}/purchase:
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          maxLength: 100
    post:
      tags: [Stars]
      summary: Pay Stars for access to a paid group and join (one transaction)
      description: >
        Idempotent per user and Idempotency-Key. Already a member, or a repeated key, returns 200 without a new charge.
        Concurrent payments for the same group charge at most once.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_price]
              properties:
                expected_price:
                  type: integer
      responses:
        '200':
          description: 'Body: {"group_id", "status": "member", "stars_paid", "balance"}'
        '400':
          description: idempotency_key_required
        '402':
          description: insufficient_stars
        '404':
          description: invite_not_found (also when the group is no longer paid)
        '409':
          description: price_changed

  /api/admin/stars/{path}:
    parameters:
      - name: path
        in: path
        required: true
        schema:
          type: string
        description: >
          settings | creators | users/{id or username} | users/{ref}/test-grant | refund | debtors |
          purchases?state=credited|voided&include_test=1&limit=1..200 | creator-applications?status=pending|approved|rejected |
          creator-applications/{id}/decide
    get:
      tags: [Stars]
      summary: Star admin tools, read (wuzz_admin only)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: >
            settings (with flags), creators list, a user's wallet (+ play_purchases), debtors, purchases
            ({"purchases": [...], "summary": {"count","stars","voided_count","test_count"}}; no raw tokens), or
            creator applications ({"applications": [{"id","user_id","username","display_name","status","message",
            "decision_note","decided_by","decided_at","created_at"}]})
        '403':
          description: admin_only
    post:
      tags: [Stars]
      summary: Star admin tools, write (wuzz_admin only)
      description: >
        creators {user, active, note}; users/{ref}/test-grant {stars 1..10000, reason} with Idempotency-Key
        (403 test_grants_disabled unless STARS_TEST_GRANTS); refund {spend_id, reason} (409 already_refunded /
        earning_already_paid); creator-applications/{id}/decide {approve, note} (approve also grants partner creator;
        note is shown to the applicant; 404 application_not_found, 409 application_decided, 400 note_too_long).
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Done
    put:
      tags: [Stars]
      summary: Update Star settings (wuzz_admin only)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StarSettings'
      responses:
        '200':
          description: Saved
        '400':
          description: settings_invalid

  /api/groups/{id}/join:
    post:
      tags:
        - Groups & Communities
      summary: Join Public Group
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Joined group
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/groups/{id}/members:
    get:
      tags:
        - Groups & Communities
      summary: List Group Members
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Members roster
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupMember'
    post:
      tags:
        - Groups & Communities
      summary: Add Members to Group (Admin only)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_ids
              properties:
                user_ids:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Members added
          content:
            application/json:
              schema:
                type: object
                properties:
                  added_count:
                    type: integer

  /api/groups/{id}/members/{user_id}:
    delete:
      tags:
        - Groups & Communities
      summary: Remove Member from Group (or Leave Group)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Member removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/groups/{id}/members/{user_id}/role:
    patch:
      tags:
        - Groups & Communities
      summary: Update Member Role (admin / member)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - role
              properties:
                role:
                  type: string
                  enum: [admin, member]
      responses:
        '200':
          description: Role updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  # =========================================================================
  # 8. EPHEMERAL FORA (SUBGROUPS)
  # =========================================================================
  /api/groups/{id}/subgroups:
    get:
      tags:
        - Ephemeral Fora (Subgroups)
      summary: List Ephemeral Fora / Subgroups for Group
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Subgroups list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Subgroup'
    post:
      tags:
        - Ephemeral Fora (Subgroups)
      summary: Create Ephemeral Subgroup with TTL
      description: Creates a focused discussion forum with a time-to-live (TTL). Upon expiry, forum locks and triggers AI Memory synthesis.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubgroupRequest'
      responses:
        '201':
          description: Subgroup created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subgroup'
        '403':
          description: |
            Ditolak. Selain peran yang tidak cukup, bisa berarti batas paket (hanya bila FORUM_LIMITS_ENABLED aktif):
            `code` = `forum_limit_reached` (batas forum aktif tercapai; ada `plan`, `limit`, `active`) atau
            `duration_not_in_plan` (durasi tidak tersedia di paket pembuat).
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                    enum: [forum_limit_reached, duration_not_in_plan]
                  plan:
                    type: string
                  limit:
                    type: integer
                  active:
                    type: integer

  /api/me/entitlement:
    get:
      tags:
        - Ephemeral Fora (Subgroups)
      summary: Status paket dan batas forum milik pemanggil
      description: Hanya data milik pemanggil. `limits_enforced` false berarti batas belum ditegakkan server (informasi saja).
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Status paket
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan:
                    type: string
                    enum: [free, pro]
                  source:
                    type: string
                  valid_until:
                    type: string
                    format: date-time
                  limits_enforced:
                    type: boolean
                  forums:
                    type: object
                    properties:
                      active:
                        type: integer
                      limit:
                        type: integer
                  allowed_duration_days:
                    type: array
                    items:
                      type: integer
                  ai:
                    type: object
                    description: Kuota ringkasan AI Memory bulan kalender (UTC) untuk forum buatan pemanggil.
                    properties:
                      enforced:
                        type: boolean
                      used:
                        type: integer
                      limit:
                        type: integer
                      reset_at:
                        type: string
                        format: date-time

  /api/groups/{id}/subgroups/{subId}/extend:
    post:
      tags:
        - Ephemeral Fora (Subgroups)
      summary: Extend Subgroup Lifetime (Pro creator)
      description: |
        Adds 1 to 3 days to an active forum's `expires_at`. Only the forum creator on the Pro plan may do this
        (plan gate follows FORUM_LIMITS_ENABLED, same as forum limits). A forum can be extended at most 30 days in total.
        Expired forums cannot be extended or reactivated. Errors carry a machine-readable `code`:
        `invalid_days` (400), `extend_pro_required` / `extend_not_creator` / `forbidden` (403), `not_found` (404),
        `forum_expired` / `extend_limit_reached` (409).
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: subId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [days]
              properties:
                days:
                  type: integer
                  minimum: 1
                  maximum: 3
      responses:
        '200':
          description: Subgroup extended
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  extend:
                    type: object
                    properties:
                      expires_at:
                        type: string
                        format: date-time
                      remaining_seconds:
                        type: integer
                      added_days:
                        type: integer
                      extended_days:
                        type: integer
                        description: Total extension days used so far (max 30).
                      extend_remaining_days:
                        type: integer

  /api/groups/{id}/subgroups/{subId}/expire:
    post:
      tags:
        - Ephemeral Fora (Subgroups)
      summary: Instant Expire Subgroup (Admin Force-Close)
      description: |
        Closes an ephemeral subgroup immediately. Memory synthesis is queued only when AI Memory is enabled for the group
        and the forum creator's monthly AI quota is not exhausted; the `memory` field reports which happened.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: subId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Subgroup closed
          content:
            application/json:
              schema:
                type: object
                properties:
                  memory:
                    type: string
                    enum: [queued, quota_exceeded, not_queued]
                  message:
                    type: string
                  status:
                    type: string
                    example: expired

  /api/groups/{id}/join-request:
    post:
      tags:
        - Ephemeral Fora (Subgroups)
      summary: Request to Join Private Group or Forum
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Request submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinRequest'

  /api/groups/{id}/join-requests:
    get:
      tags:
        - Ephemeral Fora (Subgroups)
      summary: List Pending Join Requests (Admin only)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Pending requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JoinRequest'

  /api/groups/{id}/join-requests/{requestId}/action:
    post:
      tags:
        - Ephemeral Fora (Subgroups)
      summary: Approve or Reject Join Request
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: requestId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
              properties:
                action:
                  type: string
                  enum: [approve, reject]
      responses:
        '200':
          description: Request processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  # =========================================================================
  # 9. AI MEMORY ENGINE
  # =========================================================================
  /api/memory/drafts:
    get:
      tags:
        - AI Memory Engine
      summary: List Memory Drafts Pending Review
      description: Returns drafts synthesized by the background AI engine waiting for admin human-in-the-loop review.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Memory drafts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MemoryDraft'

  /api/memory/drafts/{id}:
    get:
      tags:
        - AI Memory Engine
      summary: Get Memory Draft Details
      description: Returns complete draft details including synthesized artifacts (Decisions, Action Items, Key Takeaways, Journey Lite).
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Draft details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryDraft'

  /api/memory/drafts/{id}/artifacts/{art_id}:
    patch:
      tags:
        - AI Memory Engine
      summary: Edit Memory Artifact (Human-in-the-Loop)
      description: Allows administrators to refine or edit title and content of AI synthesized artifacts prior to approval.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: art_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                content:
                  type: string
      responses:
        '200':
          description: Artifact updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryArtifact'

  /api/memory/drafts/{id}/journey:
    delete:
      tags:
        - AI Memory Engine
      summary: Remove Journey Lite from Draft
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Journey removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/memory/drafts/{id}/approve:
    post:
      tags:
        - AI Memory Engine
      summary: Approve & Publish Memory Snapshot
      description: Commits the draft into published group memory and emits a real-time `memory_approved` event to all room members.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Draft approved and published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovedMemory'

  /api/memory/drafts/{id}/approve-with-changes:
    post:
      tags:
        - AI Memory Engine
      summary: Approve Draft with Direct Payload Overrides
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                summary:
                  type: string
                artifacts:
                  type: array
                  items:
                    $ref: '#/components/schemas/MemoryArtifact'
      responses:
        '200':
          description: Approved with changes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovedMemory'

  /api/memory/drafts/{id}/reject:
    post:
      tags:
        - AI Memory Engine
      summary: Reject Memory Draft
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Draft rejected
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: rejected

  /api/groups/{id}/memories:
    get:
      tags:
        - AI Memory Engine
      summary: List Published Group Memories
      description: Returns chronological collection of approved group memories available for members.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Published memories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApprovedMemory'

  /api/memories/{id}:
    get:
      tags:
        - AI Memory Engine
      summary: Get Published Memory Detail
      description: Fetches full memory snapshot and increments member view counter.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Published memory details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovedMemory'

  # =========================================================================
  # 10. PUSH NOTIFICATIONS
  # =========================================================================
  /api/notifications/vapid-public-key:
    get:
      tags:
        - Push Notifications
      summary: Get VAPID Public Key for Web Push
      description: Returns the base64 URL-safe VAPID application server public key for browser push subscription handshake.
      responses:
        '200':
          description: VAPID public key
          content:
            application/json:
              schema:
                type: object
                properties:
                  public_key:
                    type: string
                    example: BNq1L6_Q...

  /api/notifications/subscribe:
    post:
      tags:
        - Push Notifications
      summary: Register Push Notification Subscription
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushSubscription'
      responses:
        '200':
          description: Subscribed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/notifications/unsubscribe:
    post:
      tags:
        - Push Notifications
      summary: Unsubscribe from Push Notifications
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - endpoint
              properties:
                endpoint:
                  type: string
      responses:
        '200':
          description: Unsubscribed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  # =========================================================================
  # 11. UTILITY & DIAGNOSTICS
  # =========================================================================
  /health:
    get:
      tags:
        - Utility & Diagnostics
      summary: Health Check & Readiness Probe
      description: Probe used by load balancers, orchestrators (Kubernetes), and uptime monitors.
      responses:
        '200':
          description: Server operational
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheck'

  /api/config:
    get:
      tags:
        - Utility & Diagnostics
      summary: Public Client Configuration
      description: Media feature flags and limits for clients. No authentication.
      security: []
      responses:
        '200':
          description: Configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  media_upload_enabled:
                    type: boolean
                  max_file_size_mb:
                    type: integer
                  max_video_size_mb:
                    type: integer
                  max_video_duration_seconds:
                    type: integer
                  storage_driver:
                    type: string
                    example: r2
                  media_retention_days:
                    type: integer
                  auto_delete_on_download:
                    type: boolean

  /api/link-preview:
    get:
      tags:
        - Utility & Diagnostics
      summary: Fetch OpenGraph Metadata for Link Preview
      security:
        - BearerAuth: []
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OpenGraph metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkPreview'

  # =========================================================================
  # 11b. WUZZ GRID (DAILY GAME)
  # =========================================================================
  /api/game/today:
    get:
      tags:
        - Wuzz Grid (Daily Game)
      summary: Today's puzzle, attempt and streak
      description: |
        Returns today's puzzle for the caller's LOCAL calendar date (timezone from `/api/game/settings`, default `Asia/Jakarta`), the caller's attempt (absent until started) and streak. The solution is never returned.

        When the feature is switched off (`GAME_ENABLED` unset) the response is `200 {"enabled": false}` so clients can hide the entry card; every other game endpoint then returns `403`.

        All `/api/game/*` endpoints are rate limited to 60 requests per minute per user (`429` with `Retry-After: 60`).
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Puzzle, attempt and streak
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameToday'
        '401':
          $ref: '#/components/responses/GameUnauthorized'
        '429':
          $ref: '#/components/responses/GameRateLimited'

  /api/game/today/start:
    post:
      tags:
        - Wuzz Grid (Daily Game)
      summary: Start today's attempt
      description: Records the start time on the server. Idempotent; calling again never changes `started_at`.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Same shape as `GET /api/game/today`, with `attempt.status = playing`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameToday'
        '401':
          $ref: '#/components/responses/GameUnauthorized'
        '403':
          $ref: '#/components/responses/GameDisabled'
        '429':
          $ref: '#/components/responses/GameRateLimited'

  /api/game/today/submit:
    post:
      tags:
        - Wuzz Grid (Daily Game)
      summary: Submit a placement for today's puzzle
      description: |
        Validates the placement against the rules. Completion time is `solved_at - started_at` computed on the server. A complete but wrong placement increments `mistakes`; an incomplete one does not. Idempotent after completion: re-sending returns the same result and never counts the streak twice.

        A solve faster than `0.5s x size` is marked `suspicious` (excluded from leaderboards and streak).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameSubmitRequest'
      responses:
        '200':
          description: Result of the submission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameSubmitResult'
        '400':
          description: Malformed body, wrong length, or a column outside the grid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameError'
        '401':
          $ref: '#/components/responses/GameUnauthorized'
        '403':
          $ref: '#/components/responses/GameDisabled'
        '409':
          description: Attempt not started yet (call `start` first) or the day rolled over
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameError'
        '429':
          $ref: '#/components/responses/GameRateLimited'

  /api/game/leaderboard:
    get:
      tags:
        - Wuzz Grid (Daily Game)
      summary: Leaderboard (friends, group or public)
      description: |
        Up to 50 rows; only `solved` attempts count. Ordering: `day` = fastest time; `week` (Monday to today, caller's local dates) = most days solved, then lowest total time. Equal results share a rank.

        Filtering: users with a block relation to the caller (either direction) are excluded; owners with `hide_from_social` are excluded from other people's `friends` and `group` boards (their own row stays visible to them). The `public` board only lists users who opted in and were not removed by staff, and **never carries `display_name` or `avatar_url`**.
      security:
        - BearerAuth: []
      parameters:
        - name: scope
          in: query
          required: true
          description: friends = caller plus accepted connections; group = members of one parent group; public = opted-in players
          schema:
            type: string
            enum: [friends, group, public]
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [day, week]
            default: day
        - name: group_id
          in: query
          required: false
          description: Required when scope=group. Must start with `grp_` (forums `sub_` and direct chats are rejected).
          schema:
            type: string
            example: grp_3f2c1a9e-0000-0000-0000-000000000000
      responses:
        '200':
          description: Leaderboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameLeaderboard'
        '400':
          description: Unknown scope or period, or missing/invalid group_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameError'
        '401':
          $ref: '#/components/responses/GameUnauthorized'
        '403':
          description: Feature disabled, or the caller is not a member of the requested group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameError'
        '429':
          $ref: '#/components/responses/GameRateLimited'

  /api/game/settings:
    get:
      tags:
        - Wuzz Grid (Daily Game)
      summary: Get game preferences
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current preferences (defaults when never saved)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameSettings'
        '401':
          $ref: '#/components/responses/GameUnauthorized'
        '403':
          $ref: '#/components/responses/GameDisabled'
        '429':
          $ref: '#/components/responses/GameRateLimited'
    put:
      tags:
        - Wuzz Grid (Daily Game)
      summary: Update game preferences (partial)
      description: Fields that are not sent are left unchanged. After a timezone has been changed once, it can only be changed again after 24 hours (prevents using it to extend a streak).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameSettingsUpdate'
      responses:
        '200':
          description: Preferences after the update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameSettings'
        '400':
          description: Invalid IANA timezone or malformed body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameError'
        '401':
          $ref: '#/components/responses/GameUnauthorized'
        '403':
          $ref: '#/components/responses/GameDisabled'
        '409':
          description: Timezone is locked for 24 hours after the previous change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameError'
        '429':
          $ref: '#/components/responses/GameRateLimited'

  /api/admin/users/{id}/game-board:
    parameters:
      - name: id
        in: path
        required: true
        description: Target user ID
        schema:
          type: string
    get:
      tags:
        - Wuzz Grid (Daily Game)
      summary: "Staff: is the user hidden from the public board?"
      description: Staff only (`wuzz_moderator` or `wuzz_admin`).
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current moderation state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameBoardHidden'
        '401':
          $ref: '#/components/responses/GameUnauthorized'
        '403':
          description: Caller is not staff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameError'
        '404':
          description: User not found, or the game module is not installed on this server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameError'
    post:
      tags:
        - Wuzz Grid (Daily Game)
      summary: "Staff: hide or restore a user on the public board"
      description: |
        Removes (or restores) the user from the PUBLIC board only; the account and the friends/group boards are untouched. A note is mandatory when hiding (max 500 characters) and every action is written to an append-only audit table. Idempotent.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameBoardHideRequest'
      responses:
        '200':
          description: New moderation state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameBoardHidden'
        '400':
          description: Missing note when hiding, note too long, or malformed body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameError'
        '401':
          $ref: '#/components/responses/GameUnauthorized'
        '403':
          description: Caller is not staff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameError'
        '404':
          description: User not found, or the game module is not installed on this server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameError'
        '409':
          description: Account already deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameError'

  # =========================================================================
  # 12. DOCUMENTATION ENDPOINTS
  # =========================================================================
  /api/openapi.yaml:
    get:
      tags:
        - Utility & Diagnostics
      summary: Raw OpenAPI 3.1.0 Specification
      description: Serves the canonical OpenAPI 3.1.0 specification file in YAML format.
      responses:
        '200':
          description: Raw YAML specification
          content:
            application/yaml:
              schema:
                type: string

  /api/docs:
    get:
      tags:
        - Utility & Diagnostics
      summary: Self-Hosted Interactive API Documentation UI
      description: Embedded web UI rendering OpenAPI documentation with zero external cloud dependencies.
      responses:
        '200':
          description: Interactive documentation webpage
          content:
            text/html:
              schema:
                type: string

components:
  parameters:
    HeaderTenantID:
      name: X-Tenant-ID
      in: header
      required: false
      description: Optional tenant identifier. Falls back to JWT claims or 'default'.
      schema:
        type: string
        default: default

  responses:
    GameUnauthorized:
      description: Missing, invalid or expired session
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GameError'
    GameDisabled:
      description: The game feature is switched off on this server (`GAME_ENABLED`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GameError'
    GameRateLimited:
      description: More than 60 game requests per minute for this user. Retry after the `Retry-After` header (seconds).
      headers:
        Retry-After:
          schema:
            type: integer
            example: 60
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GameError'

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Standard 30-day session token passed as Authorization: Bearer <token>."
    B2BAppID:
      type: apiKey
      in: header
      name: X-App-ID
      description: Third-party tenant application ID.
    B2BAppSecret:
      type: apiKey
      in: header
      name: X-App-Secret
      description: Third-party tenant secret key.

  schemas:
    StarWallet:
      type: object
      properties:
        balance:
          type: integer
        debt:
          type: integer
          description: Star debt from voided Play purchases; spending is refused (402 stars_debt) while > 0
        history:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              delta:
                type: integer
              kind:
                type: string
                enum: [purchase, spend, refund, test_grant, adjustment]
              group_id:
                type: string
              group_title:
                type: string
              ref_id:
                type: string
              reason:
                type: string
              created_by:
                type: string
              created_at:
                type: string
                format: date-time
    StarSettings:
      type: object
      properties:
        star_value_minor:
          type: integer
        currency:
          type: string
        packages:
          type: array
          items:
            type: integer
        group_price_min:
          type: integer
        group_price_max:
          type: integer
        store_fee_pct:
          type: integer
        platform_pct:
          type: integer
        hold_days:
          type: integer
    InviteLink:
      type: object
      properties:
        token:
          type: string
          example: Ab3xK9qzMn4pQr7s
        path:
          type: string
          description: "Public URL is https://chat.wuzzhub.id{path}"
          example: /join/Ab3xK9qzMn4pQr7s
        mode:
          type: string
          enum: [approval]
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
    InvitePreview:
      type: object
      properties:
        group_id:
          type: string
        title:
          type: string
        avatar_url:
          type: string
        member_count:
          type: integer
        mode:
          type: string
          enum: [approval, paid]
        my_status:
          type: string
          enum: [member, pending, rejected, none]
        price_stars:
          type: integer
          description: Paid groups only (mode paid)
        my_balance:
          type: integer
          description: Paid groups only; caller's Star balance
        retry_after_seconds:
          type: integer
          description: Only when my_status is rejected and the 24-hour cooldown has not passed
    InviteJoinResult:
      type: object
      properties:
        group_id:
          type: string
        status:
          type: string
          enum: [member, pending]
    ErrorResponse:
      type: object
      description: |
        Error body used by every handler: a human-readable `error` (Indonesian) and, on newer endpoints, a
        machine-readable `code`. Some older handlers send this JSON with `Content-Type: text/plain` (Go `http.Error`).
        RFC 7807 Problem Details are NOT used.
      required:
        - error
      properties:
        error:
          type: string
          example: Username atau password salah
        code:
          type: string
          example: INVALID_CREDENTIALS
        message:
          type: string
          description: Extra human text on a few responses (e.g. ACCOUNT_SUSPENDED, DEVICE_LIMIT_REACHED).

    DeviceLimitConflict:
      type: object
      description: 409 when the account is already active on 2 other devices. Retry with `confirm_override` and `kick_device_id`.
      properties:
        error:
          type: string
          example: DEVICE_LIMIT_REACHED
        code:
          type: string
          example: DEVICE_LIMIT_REACHED
        message:
          type: string
        max_devices:
          type: integer
          example: 2
        active_devices:
          type: array
          items:
            $ref: '#/components/schemas/Device'

    DeviceFields:
      type: object
      description: Device fields shared by login, register and Google sign-in. `device_id` / `platform` fall back to the `X-Device-ID` / `X-Device-Platform` headers.
      properties:
        device_id:
          type: string
          example: dev_mobile_pixel8
        platform:
          type: string
          example: android
        confirm_override:
          type: boolean
          description: Set after a 409 DEVICE_LIMIT_REACHED to replace a device.
        kick_device_id:
          type: string
          description: Device to sign out when `confirm_override` is true.

    Tenant:
      type: object
      properties:
        id:
          type: string
          example: b2b_tenant_alpha
        name:
          type: string
          example: Enterprise Alpha
        slug:
          type: string
          example: enterprise-alpha
        status:
          type: string
          enum: [active, suspended, inactive]
          example: active
        created_at:
          type: string
          format: date-time

    User:
      type: object
      description: Matches `store.User` (password hash is never serialized).
      properties:
        id:
          type: string
          example: usr_abc12345
        tenant_id:
          type: string
          example: default
        external_user_id:
          type: string
          description: Only for B2B tenants.
        username:
          type: string
          example: johndoe
        display_name:
          type: string
          example: John Doe
        status_message:
          type: string
        bio:
          type: string
        role:
          type: string
        system_role:
          type: string
          description: Staff role (e.g. wuzz_admin, moderator) or empty.
        avatar_url:
          type: string
        metadata:
          type: object
          additionalProperties: true
        is_verified:
          type: boolean
        is_private_account:
          type: boolean
        public_key:
          type: string
          description: Base64 raw ECDH P-256 public key
        key_version:
          type: integer
          example: 1
        active_device_id:
          type: string
        created_at:
          type: string
          format: date-time

    RegisterRequest:
      type: object
      description: Legacy password registration (new users sign up with Google). Body max 64 KB.
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: alice
        password:
          type: string
          format: password
          example: StrongPassw0rd!
        display_name:
          type: string
          example: Alice
        device_id:
          type: string
        platform:
          type: string

    LoginRequest:
      allOf:
        - $ref: '#/components/schemas/DeviceFields'
        - type: object
          required:
            - username
            - password
          properties:
            username:
              type: string
              example: alice
            password:
              type: string
              format: password
              example: StrongPassw0rd!

    AuthTokenResponse:
      type: object
      description: Session response (`AuthResponse` in code) for login, register and Google sign-in/register/link.
      properties:
        token:
          type: string
          description: 30-day session JWT (renew with POST /api/auth/refresh)
        user:
          $ref: '#/components/schemas/User'
        has_password:
          type: boolean
          description: false = Google-only account; sensitive actions need Google re-auth instead of a password.
        google_linked:
          type: boolean
        google_email:
          type: string
          description: Linked Google email (owner only; omitted when unknown).
        google_link_required_by:
          type: string
          format: date-time
          description: Present only when the account must link Google before this time.
        google_link_frozen:
          type: boolean
          description: true = account frozen until Google is linked; client shows the "link Google" screen.

    GoogleManageResult:
      type: object
      properties:
        status:
          type: string
          example: ok
        google_linked:
          type: boolean

    MeResponse:
      description: GET /api/auth/me. The user fields are inlined (not nested) next to the login-method flags.
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            google_linked:
              type: boolean
            google_email:
              type: string
            has_password:
              type: boolean
            google_link_required_by:
              type: string
              format: date-time
            google_link_frozen:
              type: boolean
            account_suspended:
              type: boolean
              description: true = suspended by a moderator; client shows the suspended screen.

    GoogleLinkPending:
      type: object
      description: 200 from POST /api/auth/google when the Google account is not linked yet. Use `link_token` with /api/auth/google/register or /api/auth/google/link.
      properties:
        code:
          type: string
          enum: [GOOGLE_NOT_LINKED]
        link_token:
          type: string
        email:
          type: string
        expires_in:
          type: integer
          description: link_token lifetime in seconds

    ProvisionTokenRequest:
      type: object
      required:
        - user_id
        - username
      properties:
        user_id:
          type: string
          description: Partner platform external user UUID
          example: ext_u_12345
        username:
          type: string
          example: partner_user
        display_name:
          type: string
          example: Partner User
        avatar_url:
          type: string
          example: https://partner.com/avatars/user.jpg
        role:
          type: string
          example: member

    ProvisionTokenResponse:
      type: object
      properties:
        exchange_token:
          type: string
          description: Ephemeral 60-second single-use exchange token
        expires_in:
          type: integer
          example: 60

    ExchangeTokenRequest:
      type: object
      required:
        - exchange_token
      properties:
        exchange_token:
          type: string
        device_id:
          type: string
          example: mobile_ios_17
        device_name:
          type: string
          example: iPhone 15 Pro

    Session:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        device_id:
          type: string
        device_name:
          type: string
        ip_address:
          type: string
        is_current:
          type: boolean
        last_active_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    Device:
      type: object
      properties:
        id:
          type: string
        device_id:
          type: string
        device_name:
          type: string
        last_seen_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    Conversation:
      type: object
      description: Conversation list item (`store.ConversationItem`). `peer_*` fields are set for direct chats only.
      properties:
        id:
          type: string
        tenant_id:
          type: string
        type:
          type: string
          enum: [direct, group]
        title:
          type: string
        avatar_url:
          type: string
        description:
          type: string
        is_public:
          type: boolean
        group_username:
          type: string
        parent_id:
          type: string
          description: Parent group ID for forum (sub_) rooms
        role:
          type: string
          description: Caller's role in the group
        peer_id:
          type: string
        peer_nickname:
          type: string
        peer_public_key:
          type: string
        peer_avatar_url:
          type: string
        peer_is_verified:
          type: boolean
        last_message:
          type: string
        last_sender:
          type: string
        last_sender_id:
          type: string
        last_status:
          type: string
        is_pinned:
          type: boolean
        pinned_at:
          type: string
          format: date-time
        unread_count:
          type: integer
        updated_at:
          type: string
          format: date-time

    UserConnection:
      type: object
      properties:
        id:
          type: string
        tenant_id:
          type: string
        requester_id:
          type: string
        receiver_id:
          type: string
        status:
          type: string
          enum: [none, pending, accepted, declined, blocked]
        source_type:
          type: string
          enum: [in_app_request, phone_contact]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    FriendItem:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        display_name:
          type: string
        avatar_url:
