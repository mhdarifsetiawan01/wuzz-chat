# fly.toml app configuration file generated for wuzz-chat-backend
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'wuzz-chat-backend'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
